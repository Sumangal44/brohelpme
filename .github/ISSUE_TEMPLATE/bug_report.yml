name: 🐛 Bug Report
description: Report a bug, broken cheatsheet card, or UI issue
title: '[Bug]: '
labels: ['type: bug']
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the details below to help us reproduce and fix the bug.
  - type: dropdown
    id: bug_area
    attributes:
      label: Bug Area
      description: Where did you encounter this bug?
      options:
        - 'Cheatsheet content (formatting / code error)'
        - 'Command Palette (search / shortcuts)'
        - 'Theme / Dark mode / Light mode'
        - 'Navigation & Responsive layout'
        - 'Build or Linting error'
        - 'Other'
    validations:
      required: true
  - type: input
    id: affected_url
    attributes:
      label: Affected URL / Cheatsheet
      placeholder: 'e.g. /python, /docker, or homepage'
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we see the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
