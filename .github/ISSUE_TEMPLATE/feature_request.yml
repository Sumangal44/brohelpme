name: 💡 Feature Request
description: Suggest an idea or enhancement for BroHelpMe
title: '[Feature]: '
labels: ['type: feature']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make BroHelpMe even better? Tell us about it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like this feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered.
